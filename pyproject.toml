[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitallife"
version = "0.1.0"
description = "A minimal bottom-up digital evolution sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
digitallife = "digitallife.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
